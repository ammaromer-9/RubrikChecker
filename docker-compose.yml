services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rubriccheck
      POSTGRES_PASSWORD: rubriccheck
      POSTGRES_DB: rubriccheck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubriccheck"]
      interval: 5s
      retries: 10

  # The API in a container: docker compose --profile full up -d
  # First run: docker compose --profile full run --rm api alembic upgrade head
  api:
    profiles: ["full"]
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rubriccheck:rubriccheck@db:5432/rubriccheck
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
